<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Pipeline: analyze, upscale, fix faces, add detail, sharpen">
  <title>PixelLift pipeline</title>
  <rect width="1200" height="170" fill="#111111"/>
  <rect x="40" y="40" width="200" height="1" fill="#3d3d3d"/>
  <text x="40" y="72" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#7a7873">01</text>
  <text x="40" y="104" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f0eb">Analyze</text>
  <text x="40" y="130" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a3a19c">blur, noise, faces, subject</text><rect x="264" y="40" width="200" height="1" fill="#3d3d3d"/>
  <text x="264" y="72" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#7a7873">02</text>
  <text x="264" y="104" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f0eb">Upscale</text>
  <text x="264" y="130" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a3a19c">Real-ESRGAN x4</text><rect x="488" y="40" width="200" height="1" fill="#3d3d3d"/>
  <text x="488" y="72" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#7a7873">03</text>
  <text x="488" y="104" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f0eb">Fix faces</text>
  <text x="488" y="130" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a3a19c">CodeFormer, people only</text><rect x="712" y="40" width="200" height="1" fill="#3d3d3d"/>
  <text x="712" y="72" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#7a7873">04</text>
  <text x="712" y="104" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f0eb">Add detail</text>
  <text x="712" y="130" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a3a19c">Stable Diffusion + ControlNet</text><rect x="936" y="40" width="200" height="1" fill="#3d3d3d"/>
  <text x="936" y="72" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#7a7873">05</text>
  <text x="936" y="104" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f0eb">Sharpen</text>
  <text x="936" y="130" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a3a19c">final light pass</text>
  <rect y="38" width="200" height="3" fill="#e4572e">
    <animateTransform attributeName="transform" type="translate" values="40 0;264 0;488 0;712 0;936 0;40 0" keyTimes="0.00;0.20;0.40;0.60;0.80;1" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
